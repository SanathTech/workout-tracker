name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: workout_tracker_test
        ports: ['5432:5432']
        # Without this the job races the container and the first query fails.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The runner reaches the service over the mapped port on localhost, which is also
      # what tests/run.mjs requires — it refuses any host that isn't local, because the
      # suites truncate tables.
      DATABASE_URL: postgresql://postgres:test@localhost:5432/workout_tracker_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Create schema and seed
        working-directory: backend
        run: npm run test:setup

      - name: Run tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # The autosave loop is the most failure-prone code in the app — three incidents,
      # each one costing a gym session — so it now has real unit tests. They run first:
      # a build failure is loud, a silently wedged save loop is not.
      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
